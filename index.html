<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>开口手册 · 旅行与社交英语</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Space+Mono:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root{
    --burgundy:#7A1730; --burgundy-deep:#4F0F20;
    --rose:#B88982; --rose-light:#D9B7B1; --rose-pale:#F3E8E5;
    --paper:#F8F5F1; --paper-card:#FFFCF9; --line:#DDD1CD;
    --line2:#E9DEDA; --ink:#33272A; --muted:#76676A; --gold:#C7A66A;
    --green:#52735A; --greenbg:#F0F5F0;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#EFE8E5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);}
  .wrap{max-width:640px;margin:0 auto;background:var(--paper);min-height:100vh;box-shadow:0 0 40px rgba(79,15,32,.12);}
  header{padding:34px 24px 28px;color:#fff;position:relative;overflow:hidden;background:var(--burgundy);}
  header::before{content:"";position:absolute;inset:0;opacity:.10;pointer-events:none;
    background:radial-gradient(circle at 82% 18%,var(--rose-light) 0 1px,transparent 2px),
    radial-gradient(circle at 18% 80%,var(--rose-light) 0 1px,transparent 2px);
    background-size:18px 18px;}
  .passport-mark{width:46px;height:46px;border:1px solid rgba(255,255,255,.55);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:21px;margin-bottom:18px;color:var(--rose-light);}
  .eyebrow{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--rose-light);}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:31px;margin:8px 0 5px;line-height:1.1;}
  .sub{font-size:13px;color:#E9D8D6;margin:0;}
  .passport-id{font-family:monospace;font-size:9px;letter-spacing:.18em;color:#D7BEBB;margin-top:17px;}
  .progress-row{display:flex;align-items:center;gap:14px;margin-top:22px;}
  .progress-track{flex:1;height:5px;border-radius:999px;background:rgba(0,0,0,.25);overflow:hidden;}
  .progress-fill{height:100%;background:var(--rose-light);transition:width .5s;}
  .progress-label{font-family:monospace;font-size:11px;color:#F4E9E7;white-space:nowrap;}

  main{background:var(--paper);border-radius:18px 18px 0 0;min-height:70vh;padding:22px 18px 64px;margin-top:-1px;}
  .section-label{display:flex;align-items:baseline;gap:8px;margin:8px 2px 12px;}
  .section-label .code{font-family:monospace;font-size:10px;color:var(--rose);}
  .section-label h2{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:17px;color:var(--burgundy);margin:0;}
  .section-label .en{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}

  .cat-list{display:flex;flex-direction:column;gap:10px;margin-bottom:28px;}
  .cat-card{border:1px solid var(--line);background:var(--paper-card);border-radius:8px;overflow:hidden;cursor:pointer;text-align:left;width:100%;
    box-shadow:0 2px 8px rgba(79,15,32,.035);transition:.2s;}
  .cat-card:hover{transform:translateY(-1px);border-color:var(--rose);}
  .cat-inner{padding:14px 14px 13px;display:flex;align-items:center;gap:13px;}
  .icon-circle{width:42px;height:42px;border-radius:50%;background:var(--rose-pale);border:1px solid var(--rose-light);color:var(--burgundy);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;}
  .cat-text{flex:1;min-width:0;}
  .cat-code{font-family:monospace;font-size:9px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;}
  .cat-title-en{font-weight:600;color:var(--burgundy);font-size:14px;line-height:1.25;}
  .cat-title-cn{font-size:12px;color:var(--muted);margin-top:2px;}
  .chevron{color:var(--rose);font-size:17px;}
  .cat-bar{height:2px;background:var(--line2);width:100%;}
  .cat-bar-fill{height:100%;background:var(--rose);transition:width .5s;}

  .stamp{border-radius:50%;border:1.5px solid;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .3s;}
  .stamp.sm{width:34px;height:34px;font-size:14px;}
  .stamp.md{width:52px;height:52px;font-size:20px;}
  .stamp.filled{border-color:var(--rose);color:var(--burgundy);background:var(--rose-pale);transform:rotate(-6deg);opacity:1;}
  .stamp.empty{border-color:#CFC1BE;color:#CFC1BE;opacity:.7;}

  .back-btn{background:none;border:none;color:var(--muted);font-size:12px;margin-bottom:15px;cursor:pointer;padding:0;}
  .detail-header{display:flex;align-items:center;gap:11px;margin-bottom:4px;}
  .detail-title-en{font-weight:600;color:var(--burgundy);font-size:17px;line-height:1.2;}
  .detail-title-cn{font-size:12px;color:var(--muted);margin-top:2px;}

  .mode-toggle{display:flex;gap:7px;margin:18px 0 14px;}
  .mode-btn{padding:7px 13px;border-radius:999px;font-size:11px;font-weight:500;border:1px solid var(--line);cursor:pointer;background:#fff;color:var(--muted);}
  .mode-btn.active{background:var(--burgundy);border-color:var(--burgundy);color:#fff;}

  .phrase-box{border:1px solid var(--line);background:var(--paper-card);border-radius:8px;overflow:hidden;}
  .phrase-row{display:flex;align-items:flex-start;gap:11px;padding:13px 13px;border-bottom:1px solid var(--line2);}
  .phrase-row:last-child{border-bottom:none;}
  .phrase-row.mastered{background:var(--greenbg);}
  .check-btn{margin-top:2px;width:23px;height:23px;border-radius:50%;border:1.5px solid var(--rose-light);background:none;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;color:transparent;font-size:12px;font-weight:bold;}
  .check-btn.on{background:var(--rose);border-color:var(--rose);color:#fff;}
  .phrase-text{flex:1;min-width:0;}
  .phrase-en{font-size:14px;color:var(--ink);line-height:1.45;}
  .phrase-cn{font-size:12px;color:var(--muted);margin-top:3px;}
  .speak-btn{margin-top:0;width:30px;height:30px;border-radius:50%;border:1px solid var(--rose-light);background:#fff;color:var(--burgundy);cursor:pointer;flex-shrink:0;font-size:13px;}

  .drill-wrap{display:flex;flex-direction:column;align-items:center;padding:30px 10px;}
  .drill-eyebrow{font-family:monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:17px;}
  .drill-card{width:100%;max-width:380px;border:1px solid var(--line);background:var(--paper-card);border-radius:10px;padding:34px 22px;text-align:center;min-height:195px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(79,15,32,.05);}
  .drill-prompt{font-size:12px;color:var(--muted);margin-bottom:9px;}
  .drill-en{font-size:18px;font-weight:600;color:var(--burgundy);line-height:1.45;margin-bottom:13px;}
  .reveal-btn{background:none;border:none;color:var(--rose);font-size:12px;text-decoration:underline;cursor:pointer;}
  .drill-cn{font-size:15px;color:var(--ink);border-top:1px solid var(--line2);padding-top:13px;width:100%;}
  .drill-controls{display:flex;align-items:center;gap:10px;margin-top:18px;}
  .circle-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--rose-light);background:#fff;color:var(--burgundy);cursor:pointer;font-size:14px;}
  .next-btn{padding:10px 23px;border-radius:999px;background:var(--burgundy);color:#fff;border:none;font-size:13px;font-weight:500;cursor:pointer;}
  .exit-drill{background:none;border:none;color:var(--muted);font-size:11px;text-decoration:underline;margin-top:18px;cursor:pointer;}
  .empty-hint{text-align:center;font-size:11px;color:var(--muted);margin-top:25px;}

  .app-nav{display:flex;gap:7px;padding:10px 18px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;}
  .nav-btn{flex:1;padding:9px 8px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);font-size:11px;cursor:pointer;}
  .nav-btn.active{background:var(--burgundy);border-color:var(--burgundy);color:#fff;}
  .page-title{font-family:Georgia,"Times New Roman",serif;font-size:21px;color:var(--burgundy);margin:7px 0 4px;}
  .page-sub{font-size:12px;color:var(--muted);margin:0 0 18px;}
  .checkin-card,.word-form,.word-card,.stats-card{border:1px solid var(--line);background:var(--paper-card);border-radius:9px;box-shadow:0 2px 10px rgba(79,15,32,.035);}
  .checkin-card{padding:17px;margin-bottom:14px;}
  .checkin-top{display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .checkin-title{font-weight:600;color:var(--burgundy);font-size:15px;}
  .checkin-date{font-family:monospace;font-size:10px;color:var(--muted);}
  .checkin-btn{margin-top:14px;width:100%;padding:11px;border:0;border-radius:999px;background:var(--rose);color:#fff;font-size:13px;cursor:pointer;}
  .checkin-btn.done{background:var(--green);}
  .streak{font-family:Georgia,"Times New Roman",serif;font-size:28px;color:var(--burgundy);margin:10px 0 2px;}
  .heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:14px;}
  .day-cell{aspect-ratio:1;border-radius:3px;background:#E9DEDA;border:1px solid #E1D5D1;display:flex;align-items:center;justify-content:center;font-size:8px;color:#8D7D7F;}
  .day-cell.done{background:var(--rose);color:#fff;border-color:var(--rose);}
  .day-cell.today{outline:2px solid var(--burgundy);outline-offset:1px;}
  .legend{font-size:10px;color:var(--muted);margin-top:8px;}
  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px;}
  .stats-card{padding:14px;}
  .stats-num{font-family:Georgia,"Times New Roman",serif;font-size:23px;color:var(--burgundy);}
  .stats-label{font-size:10px;color:var(--muted);margin-top:2px;}
  .word-form{padding:16px;margin-bottom:18px;}
  .field-label{font-size:10px;color:var(--muted);margin:0 0 6px;}
  .word-input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:14px;outline:none;color:var(--ink);}
  .word-input:focus{border-color:var(--rose);}
  .word-add{width:100%;margin-top:10px;padding:11px;border:0;border-radius:999px;background:var(--burgundy);color:#fff;font-size:13px;cursor:pointer;}
  .word-note{font-size:10px;color:var(--muted);line-height:1.5;margin:9px 1px 0;}
  .word-list{display:flex;flex-direction:column;gap:10px;}
  .word-card{padding:15px;}
  .word-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .word-main{min-width:0;}
  .word-en{font-family:Georgia,"Times New Roman",serif;font-size:21px;color:var(--burgundy);font-weight:600;}
  .word-meta{font-size:11px;color:var(--muted);margin-top:3px;}
  .word-cat{display:inline-block;padding:4px 7px;border-radius:999px;background:var(--rose-pale);color:var(--burgundy);font-size:9px;white-space:nowrap;}
  .word-meaning{font-size:13px;color:var(--ink);margin-top:11px;padding-top:10px;border-top:1px solid var(--line2);}
  .word-examples{margin:10px 0 0;padding-left:18px;color:var(--ink);font-size:12px;line-height:1.6;}
  .word-examples li{margin-bottom:4px;}
  .word-empty{text-align:center;padding:24px 10px;color:var(--muted);font-size:11px;border:1px dashed var(--line);border-radius:8px;}
  .section-mini{font-size:10px;letter-spacing:.12em;color:var(--rose);text-transform:uppercase;margin:20px 2px 9px;}

  .import-box{border:1px dashed var(--line);border-radius:9px;padding:14px;margin-bottom:16px;background:var(--rose-pale);}
  .import-box textarea{width:100%;min-height:90px;padding:10px;border:1px solid var(--line);border-radius:7px;font-family:monospace;font-size:11px;color:var(--ink);resize:vertical;outline:none;}
  .import-box textarea:focus{border-color:var(--rose);}
  .import-btn{margin-top:8px;padding:9px 16px;border:0;border-radius:999px;background:var(--burgundy);color:#fff;font-size:12px;cursor:pointer;}
  .import-msg{font-size:11px;margin-top:8px;}
  .import-msg.ok{color:var(--green);}
  .import-msg.err{color:#B3382C;}
  .import-toggle{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:11px;color:var(--muted);cursor:pointer;margin-bottom:12px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="passport-mark">✦</div><div class="eyebrow">PASAPORTE · PHRASEBOOK</div>
    <h1>开口手册</h1>
    <p class="sub">旅行、社交与真实场景英语 · 练到张口就来</p><div class="passport-id">DOCUMENT / ENGLISH · GC-2026</div>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="overallFill" style="width:0%"></div></div>
      <div class="progress-label" id="overallLabel">0/0 已通关</div>
    </div>
  </header>
  <nav class="app-nav">
      <button class="nav-btn active" id="navHome" onclick="switchPage('home')">学习</button>
      <button class="nav-btn" id="navCheckin" onclick="switchPage('checkin')">每日打卡</button>
      <button class="nav-btn" id="navWords" onclick="switchPage('words')">我的单词</button>
    </nav>
    <main id="main"></main>
</div>

<script>
const CATEGORIES = [
  { id:"checkin", group:"travel", code:"TR-01", titleEn:"Airport & Check-in", titleCn:"机场值机", icon:"✈", phrases:[
    {en:"Where is the check-in counter for this airline?", cn:"这家航空公司的值机柜台在哪里？"},
    {en:"I'd like a window seat, please.", cn:"我想要一个靠窗的座位。"},
    {en:"How many bags can I check in?", cn:"我可以托运几件行李？"},
    {en:"I'm worried I'll miss my connecting flight.", cn:"我担心赶不上转机。"},
    {en:"Could you help me find gate twelve?", cn:"能帮我找一下12号登机口吗？"},
    {en:"Is the flight on time?", cn:"航班准点吗？"},
    {en:"Can I take this bag on board?", cn:"这个包可以带上飞机吗？"},
    {en:"Where do I go through security?", cn:"安检在哪里？"},
    {en:"Could you print my boarding pass?", cn:"可以帮我打印登机牌吗？"}
  ]},
  { id:"directions", group:"travel", code:"TR-02", titleEn:"Asking Directions", titleCn:"问路", icon:"⌖", phrases:[
    {en:"Excuse me, how do I get to the old town?", cn:"请问怎么去老城区？"},
    {en:"Is it within walking distance?", cn:"走路能到吗？"},
    {en:"Go straight, then turn left at the corner.", cn:"直走，然后在拐角左转。"},
    {en:"Am I heading the right way for the station?", cn:"我这样走去车站对吗？"},
    {en:"Could you point me in the right direction?", cn:"能给我指一下方向吗？"},
    {en:"How long does it take to get there?", cn:"到那里大概要多久？"},
    {en:"Is there a bus stop nearby?", cn:"附近有公交车站吗？"},
    {en:"Could you show me on the map?", cn:"可以在地图上指给我看吗？"},
    {en:"Is this street safe at night?", cn:"这条街晚上安全吗？"}
  ]},
  { id:"hotel", group:"travel", code:"TR-03", titleEn:"Hotel Check-in", titleCn:"酒店入住", icon:"⌂", phrases:[
    {en:"I have a reservation under this name.", cn:"我用这个名字订了房。"},
    {en:"What time is checkout?", cn:"几点退房？"},
    {en:"Is breakfast included?", cn:"含早餐吗？"},
    {en:"Could I get a late checkout?", cn:"能延迟退房吗？"},
    {en:"The Wi-Fi isn't working in my room.", cn:"房间的 Wi-Fi 连不上。"},
    {en:"Could I leave my luggage here for a few hours?", cn:"我可以把行李寄放几个小时吗？"},
    {en:"Is there a washing machine I can use?", cn:"这里有可以使用的洗衣机吗？"},
    {en:"Could you recommend a good local restaurant?", cn:"能推荐一家当地不错的餐厅吗？"},
    {en:"Is there a pharmacy nearby?", cn:"附近有药店吗？"}
  ]},
  { id:"food", group:"travel", code:"TR-04", titleEn:"Restaurants & Cafés", titleCn:"餐厅与咖啡店", icon:"☕", phrases:[
    {en:"Could I get the menu, please?", cn:"能给我看下菜单吗？"},
    {en:"I'll have this one, thanks.", cn:"我要这个，谢谢。"},
    {en:"Not too spicy, please.", cn:"请不要太辣。"},
    {en:"Could you make it to go?", cn:"可以打包吗？"},
    {en:"Check, please.", cn:"买单，谢谢。"},
    {en:"What do you recommend?", cn:"你推荐什么？"},
    {en:"Does this contain dairy?", cn:"这个含乳制品吗？"},
    {en:"Could I get an extra glass of water?", cn:"可以再给我一杯水吗？"},
    {en:"I'd like a coffee with less sugar.", cn:"我想要一杯少糖的咖啡。"},
    {en:"Is this a local specialty?", cn:"这是当地特色吗？"}
  ]},
  { id:"transport", group:"travel", code:"TR-05", titleEn:"Transport & Getting Around", titleCn:"交通出行", icon:"↗", phrases:[
    {en:"How much is a taxi to the city center?", cn:"打车到市中心多少钱？"},
    {en:"Could you take me to this address?", cn:"可以带我去这个地址吗？"},
    {en:"How do I buy a train ticket?", cn:"怎么买火车票？"},
    {en:"Which platform do I need?", cn:"我要去哪个站台？"},
    {en:"Does this bus go to the city center?", cn:"这趟公交去市中心吗？"},
    {en:"Can I pay by card?", cn:"可以刷卡吗？"},
    {en:"Where can I rent a car?", cn:"哪里可以租车？"},
    {en:"I need to return the vehicle tomorrow morning.", cn:"我明天早上需要还车。"}
  ]},
  { id:"motorcycle", group:"travel", code:"TR-06", titleEn:"Motorcycle Travel", titleCn:"摩托车旅行", icon:"⌁", phrases:[
    {en:"Is this road open to motorcycles?", cn:"这条路允许摩托车通行吗？"},
    {en:"Where can I park the motorcycle?", cn:"摩托车可以停在哪里？"},
    {en:"Is there a gas station nearby?", cn:"附近有加油站吗？"},
    {en:"Do you know a good motorcycle repair shop?", cn:"你知道附近有好的摩托车维修店吗？"},
    {en:"I need to check the tire pressure.", cn:"我需要检查胎压。"},
    {en:"Could you help me find a safe place to stay?", cn:"能帮我找个安全的住宿吗？"},
    {en:"How far is the next town?", cn:"下一个城镇还有多远？"},
    {en:"Is there a mountain pass on this route?", cn:"这条路线会经过山口吗？"},
    {en:"The weather looks bad. Is there another route?", cn:"天气看起来不好，有其他路线吗？"}
  ]},
  { id:"trouble", group:"travel", code:"TR-07", titleEn:"Unexpected Situations", titleCn:"突发状况", icon:"!", phrases:[
    {en:"I think I lost my wallet.", cn:"我的钱包好像丢了。"},
    {en:"Could you call the police for me?", cn:"能帮我报警吗？"},
    {en:"I don't feel well. Is there a pharmacy nearby?", cn:"我不太舒服，附近有药店吗？"},
    {en:"I missed my train. What should I do?", cn:"我错过火车了，该怎么办？"},
    {en:"Sorry, could you say that a little slower?", cn:"抱歉，能说慢一点吗？"},
    {en:"I don't understand. Could you write it down?", cn:"我没听懂，可以写下来吗？"},
    {en:"I need help.", cn:"我需要帮助。"},
    {en:"Can you speak English?", cn:"你会说英语吗？"},
    {en:"Where is the nearest hospital?", cn:"最近的医院在哪里？"}
  ]},

  { id:"intro", group:"social", code:"SC-01", titleEn:"Meeting New People", titleCn:"认识新朋友", icon:"◌", phrases:[
    {en:"Where are you from?", cn:"你来自哪里？"},
    {en:"Is this your first time here?", cn:"你第一次来这里吗？"},
    {en:"What brings you here?", cn:"是什么让你来到这里的？"},
    {en:"How long are you staying?", cn:"你会待多久？"},
    {en:"What do you do for a living?", cn:"你是做什么工作的？"},
    {en:"It's really nice to meet you.", cn:"很高兴认识你。"},
    {en:"Are you traveling alone?", cn:"你一个人旅行吗？"},
    {en:"Do you have any plans for tonight?", cn:"你今晚有什么计划吗？"}
  ]},
  { id:"likes", group:"social", code:"SC-02", titleEn:"Likes & Dislikes", titleCn:"表达喜欢与不喜欢", icon:"♥", phrases:[
    {en:"I really like this. It's so different from back home.", cn:"我真挺喜欢，跟我家乡很不一样。"},
    {en:"I'm not really into it, to be honest.", cn:"说实话我不太喜欢。"},
    {en:"This is exactly my kind of thing.", cn:"这正合我的口味。"},
    {en:"It's not bad, just not really for me.", cn:"也不差，只是不太适合我。"},
    {en:"I love the atmosphere here.", cn:"我很喜欢这里的氛围。"},
    {en:"That's one of my favorite things.", cn:"那是我最喜欢的事情之一。"}
  ]},
  { id:"surprise", group:"social", code:"SC-03", titleEn:"Surprise & Curiosity", titleCn:"惊讶与好奇", icon:"✦", phrases:[

function escapeHtml(str){
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}
const htmlmod = { escape: escapeHtml };

async function fetchWordDetails(word){
  const prompt = `你是英语教学助手。针对英文单词或短语 "${word}"，只返回严格的JSON对象（不要markdown代码块，不要任何多余文字），字段如下：
{
  "phonetic": "国际音标，形如 /.../",
  "pos": "词性缩写，例如 n. / v. / adj. / adv. / phrase",
  "meaning": "简明中文释义，不超过20个字",
  "category": "从下面选一个最贴切的分类：咖啡、酒店、摩托车旅行、餐饮、酒吧与夜生活、旅行、社交、商务、待确认",
  "examples": [
    {"en":"英文例句1","cn":"对应中文翻译1"},
    {"en":"英文例句2","cn":"对应中文翻译2"},
    {"en":"英文例句3","cn":"对应中文翻译3"},
    {"en":"英文例句4","cn":"对应中文翻译4"},
    {"en":"英文例句5","cn":"对应中文翻译5"}
  ]
}
例句要贴近旅行、咖啡烘焙、社交这类真实场景，长度适中，自然口语化。`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{ role: "user", content: prompt }],
    }),
  });
  const data = await response.json();
  const text = (data.content || [])
    .map((b) => (b.type === "text" ? b.text : ""))
    .join("");
  const clean = text.replace(/```json|```/g, "").trim();
  return JSON.parse(clean);
}

async function completeWord(id){
  const entry = myWords[id];
  if(!entry) return;
  entry.loading = true;
  entry.phonetic = entry.phonetic === "生成失败" ? "生成中…" : entry.phonetic;
  render();
  try{
    const details = await fetchWordDetails(entry.word);
    myWords[id] = {
      word: entry.word,
      category: details.category || entry.category,
      phonetic: details.phonetic || "未知",
      pos: details.pos || "未知",
      meaning: details.meaning || "未知",
      examples: Array.isArray(details.examples) ? details.examples : [],
      loading: false,
    };
  }catch(e){
    console.error("word detail fetch failed", e);
    myWords[id] = { ...entry, phonetic:"生成失败", pos:"生成失败", meaning:"生成失败，点击卡片上的按钮重试", loading:false };
  }
  saveWords();
  render();
}

function importWords(){
  const box = document.getElementById("importArea");
  const msgBox = document.getElementById("importMsg");
  if(!box) return;
  let list;
  try{
    list = JSON.parse(box.value.trim());
    if(!Array.isArray(list)) throw new Error("not array");
  }catch(e){
    if(msgBox){ msgBox.textContent = "格式不对，确认粘贴的是完整的JSON数组"; msgBox.className = "import-msg err"; }
    return;
  }
  let count = 0;
  list.forEach(item=>{
    if(!item || !item.word) return;
    const id = String(item.word).toLowerCase();
    myWords[id] = {
      word: item.word,
      category: item.category || "待确认",
      phonetic: item.phonetic || "未知",
      pos: item.pos || "未知",
      meaning: item.meaning || "未知",
      examples: Array.isArray(item.examples) ? item.examples : [],
      loading: false,
    };
    count++;
  });
  saveWords();
  box.value = "";
  if(msgBox){ msgBox.textContent = `已导入 ${count} 个词条`; msgBox.className = "import-msg ok"; }
  render();
}

function phraseKey(catId, idx){ return catId + ":" + idx; }

let englishVoices = [];

// Rank voices so higher-quality ones (network/neural/enhanced voices,
// as opposed to the default compact/robotic ones) sort first, and
// silently use the best one available — no picker shown to the user.
function voiceQualityScore(v){
  const n = v.name.toLowerCase();
  let score = 0;
  if(/premium|enhanced|neural|natural|siri/.test(n)) score += 3;
  if(/google/.test(n)) score += 2;
  if(v.localService === false) score += 1;
  if(/compact/.test(n)) score -= 2;
  if(v.lang === "en-US") score += 1;
  return score;
}

function populateVoiceList(){
  const all = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  englishVoices = all
    .filter(v => v.lang && v.lang.toLowerCase().startsWith("en"))
    .sort((a,b) => voiceQualityScore(b) - voiceQualityScore(a));
}

function speak(text){
  if(!("speechSynthesis" in window)){
    alert("这个浏览器不支持朗读功能，换个浏览器试试（推荐 Chrome / Safari 最新版）");
    return;
  }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.92;
  if(englishVoices.length) u.voice = englishVoices[0];
  window.speechSynthesis.speak(u);
}

function speakPhrase(catId, idx){
  const cat = CATEGORIES.find(c=>c.id===catId);
  if(cat) speak(cat.phrases[idx].en);
}

// Voice lists load asynchronously on many browsers — iOS Safari in
// particular sometimes fires "voiceschanged" late or not at all, so we
// retry a couple of times on load as a fallback.
if("speechSynthesis" in window){
  populateVoiceList();
  window.speechSynthesis.onvoiceschanged = populateVoiceList;
  setTimeout(populateVoiceList, 300);
  setTimeout(populateVoiceList, 1200);
}

function classifyWord(w){
  const x=w.toLowerCase().trim();
  const rules=[
    [/coffee|espresso|latte|cafe|brew|roast|bean|barista/,"咖啡"],
    [/hotel|room|reservation|check|checkout|luggage/,"酒店"],
    [/motorcycle|motorbike|helmet|tire|tyre|engine|ride|road/,"摩托车旅行"],
    [/restaurant|menu|food|dish|spicy|order|bill|table/,"餐饮"],
    [/bar|drink|cocktail|beer|wine|club|party/,"酒吧与夜生活"],
    [/travel|trip|flight|airport|train|station|ticket|passport/,"旅行"],
    [/meet|friend|talk|conversation|social|date|flirt/,"社交"],
    [/business|marketing|customer|brand|sales|cost|profit/,"商务"],
  ];
  for(const [re,cat] of rules) if(re.test(x)) return cat;
  return "待确认";
}

        ${drillRevealed
          ? `<div class="drill-cn">${p.cn}</div>`
          : `<button class="reveal-btn" onclick="drillReveal()">显示中文</button>`}
      </div>
      <div class="drill-controls">
        <button class="circle-btn" onclick="speakPhrase('${cat.id}',${idx})">🔊</button>
        <button class="next-btn" onclick="drillNext()">下一句</button>
      </div>
      <button class="exit-drill" onclick="setMode('list')">退出速记，返回词条列表</button>
    </div>`;
  }

  return `
    <button class="back-btn" onclick="backToList()">← 返回全部场景</button>
    <div class="detail-header">
      <div class="icon-circle">${cat.icon}</div>
      <div>
        <div class="detail-title-en">${cat.titleEn}</div>
        <div class="detail-title-cn">${cat.titleCn}</div>
      </div>
      <div class="stamp md ${complete?'filled':'empty'}">◈</div>
    </div>
    <div class="mode-toggle">
      <button class="mode-btn ${mode==='list'?'active':''}" onclick="setMode('list')">词条列表</button>
      <button class="mode-btn ${mode==='drill'?'active':''}" onclick="setMode('drill')">速记模式</button>
    </div>
    ${body}
  `;
}

function render(){
  const main = document.getElementById("main");
  if(currentPage==="checkin") main.innerHTML=renderCheckin();
  else if(currentPage==="words") main.innerHTML=renderWords();
  else main.innerHTML=openCat ? renderDetail() : renderHome();
  updateOverall();
}

loadProgress();
</script>
</body>
</html>
